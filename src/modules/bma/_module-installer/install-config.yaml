# BMAD™ Marketing & Advertising Module Configuration

code: bma
name: "BMA: BMad Marketing & Advertising Studio"
default_selected: false # User must explicitly select this module

header: "BMad Marketing & Advertising Studio"
subheader: "AI-powered marketing framework with 10 specialized agents, 8 workflows, and 350+ marketing tasks"

# Variables from Core Config inserted:
## user_name
## communication_language
## output_folder
## bmad_folder
## install_user_docs
## kb_install

marketing_output_folder:
  prompt: "Where should marketing campaign artifacts be stored?"
  default: "{output_folder}/marketing"
  result: "{project-root}/{value}"

default_brand_voice:
  prompt:
    - "What is your brand's default communication style?"
    - "This affects how marketing content is generated."
  default: "professional"
  result: "{value}"
  single-select:
    - value: "professional"
      label: "Professional - Corporate, polished, authoritative"
    - value: "casual"
      label: "Casual - Friendly, approachable, conversational"
    - value: "bold"
      label: "Bold - Edgy, provocative, attention-grabbing"
    - value: "luxury"
      label: "Luxury - Sophisticated, exclusive, premium"
    - value: "playful"
      label: "Playful - Fun, energetic, youthful"

target_platforms:
  prompt: "Which marketing platforms do you primarily use?"
  default: "all"
  result: "{value}"
  multi-select:
    - value: "social"
      label: "Social Media (Twitter, Instagram, LinkedIn, TikTok)"
    - value: "email"
      label: "Email Marketing"
    - value: "paid"
      label: "Paid Advertising (Google Ads, Facebook Ads)"
    - value: "seo"
      label: "SEO & Content Marketing"
    - value: "ecommerce"
      label: "E-commerce"
    - value: "all"
      label: "All Platforms"

analytics_integration:
  prompt: "Enable analytics and reporting features?"
  default: true
  result: "{value}"
